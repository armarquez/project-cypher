name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML
        run: |
          python3 - <<'EOF'
          import yaml, pathlib, sys
          errors = []
          files = [p for p in pathlib.Path('.').rglob('*')
                   if '.git' not in p.parts and p.suffix in ('.yaml', '.yml')]
          for p in files:
              try:
                  yaml.safe_load(p.read_text())
              except yaml.YAMLError as e:
                  errors.append(f"{p}: {e}")
          if errors:
              for e in errors:
                  print(f"INVALID: {e}")
              sys.exit(1)
          print(f"Validated {len(files)} YAML file(s)")
          EOF

      - uses: jdx/mise-action@v2

      - name: Check
        if: hashFiles('go.mod') != ''
        run: just check

      - name: Coverage
        if: hashFiles('go.mod') != ''
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          if [ "${COVERAGE%.*}" -lt 80 ]; then
            echo "Coverage ${COVERAGE}% is below the 80% threshold"
            exit 1
          fi
          echo "Coverage: ${COVERAGE}%"
